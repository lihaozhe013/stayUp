[package]
name = "stayup-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
